<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102f48">
  <title>Freeze Monkey · Catálogo de prueba</title>
  <meta name="description" content="Catálogo interactivo de bebidas y combos Freeze Monkey.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23102f48'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='37'%3E%F0%9F%90%92%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">FM</span><span>Freeze Monkey<small>Catálogo de prueba</small></span></div>
    <button id="cart-toggle" class="cart-toggle" type="button" aria-controls="cart" aria-expanded="false">Mi selección <span id="cart-count">0</span></button>
  </header>
  <main class="layout">
    <section class="catalog" aria-labelledby="title">
      <div class="intro"><p class="eyebrow">Bebidas y combos</p><h1 id="title">Encuentra tu favorito</h1></div>
      <div class="controls"><label class="search"><span class="sr-only">Buscar productos</span><input id="search" type="search" placeholder="Buscar por nombre…" autocomplete="off"></label><div class="filters" role="group" aria-label="Filtrar productos"><button class="active" data-filter="todos" type="button">Todos</button><button data-filter="frappes" type="button">Frappés</button><button data-filter="smoothies" type="button">Smoothies</button><button data-filter="combos" type="button">Combos</button></div></div>
      <p id="result-count" class="result-count" aria-live="polite"></p>
      <div id="products" class="grid"></div>
      <p id="empty" class="empty" hidden>No encontramos productos con esa búsqueda.</p>
    </section>
    <aside id="cart" class="cart" aria-label="Mi selección">
      <div class="cart-heading"><h2>Mi selección</h2><button id="cart-close" type="button" class="close" aria-label="Cerrar selección">×</button></div>
      <p class="demo-note">Vista de prueba: aquí puedes armar una selección, pero no enviar pedidos.</p>
      <div id="cart-items" class="cart-items"></div>
      <div class="total"><span>Total estimado</span><strong id="total">$0</strong></div>
      <button id="clear" type="button" class="clear">Vaciar selección</button>
    </aside>
  </main>
</body>
</html>
